# --- INPUTS ---

SectionDevice."In1" {
	Comment "Mic / Instrument Input 1"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 1000
		Channel 0
	}
}

SectionDevice."In2" {
	Comment "Mic / Instrument Input 2"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 990
		Channel 1
	}
}

SectionDevice."In3" {
	Comment "Line Input 3"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 900
		Channel 2
	}
}

SectionDevice."In4" {
	Comment "Line Input 4"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 895
		Channel 3
	}
}

SectionDevice."In5" {
	Comment "Line Input 5"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 890
		Channel 4
	}
}

SectionDevice."In6" {
	Comment "Line Input 6"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 885
		Channel 5
	}
}

SectionDevice."In7" {
	Comment "Line Input 7"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 880
		Channel 6
	}
}

SectionDevice."In8" {
	Comment "Line Input 8"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 875
		Channel 7
	}
}

SectionDevice."In9" {
	Comment "S/PDIF Input L"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 800
		Channel 8
	}
}

SectionDevice."In10" {
	Comment "S/PDIF Input R"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 790
		Channel 9
	}
}

SectionDevice."In11" {
	Comment "ADAT Input 1"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 700
		Channel 10
	}
}

SectionDevice."In12" {
	Comment "ADAT Input 2"
	Macro.channel.Quantum2626CaptureChannel {
		Priority 690
		Channel 11
	}
}
