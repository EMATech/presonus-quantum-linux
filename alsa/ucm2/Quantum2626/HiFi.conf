# HiFi.conf
# Specific configuration for PreSonus Quantum 2626

Define.INPUT_CHANNELS 26
Define.OUTPUT_CHANNELS 26

Include.common.File "/Quantum/Common.conf"

# --- OUTPUTS ---

SectionDevice."Out1" {
	Comment "Main / Line 1-2 / Headphones"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 1000
		Channel0 0
		Channel1 1
	}
}

SectionDevice."Out2" {
	Comment "Line Outputs 3-4"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 900
		Channel0 2
		Channel1 3
	}
}

SectionDevice."Out3" {
	Comment "Line Outputs 5-6"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 890
		Channel0 4
		Channel1 5
	}
}

SectionDevice."Out4" {
	Comment "Line Outputs 7-8"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 880
		Channel0 6
		Channel1 7
	}
}

SectionDevice."Out5" {
	Comment "S/PDIF Outputs 1-2"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 800
		Channel0 8
		Channel1 9
	}
}

SectionDevice."Out6" {
	Comment "ADAT Outputs 1-2"
	Macro.pair.Quantum2626PlaybackPair {
		Priority 700
		Channel0 10
		Channel1 11
	}
}

